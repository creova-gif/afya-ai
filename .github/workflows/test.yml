name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ai-route-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: npm install --no-save --ignore-scripts --no-package-lock hono@4.7.11
      - name: AI route tests
        run: npm test
